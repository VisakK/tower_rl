# push_in skill (Task 5): push the released, part-inserted block home with the fingers at the pusher width.
# Geometry: configs/skills/insert.yaml (geometry). Units m, rad unless *_deg.
arm: left
num_envs: 3072
episode_steps: 80              # 8 s (demo push: ~4 s)
variants: [task5-2_tower_insertion_2, task5-3_tower_insertion_3]
tiers: {D0: 0.25, D1: 0.25, D2: 0.5}
scene:
  max_movable: 9
  finger_effort_n: 3.0
  collider: cuboid
  slot_dims: {0: [0.15, 0.05, 0.032], 1: [0.15, 0.05, 0.032], 2: [0.15, 0.05, 0.032], 3: [0.15, 0.05, 0.032]}
  slot_mass: {0: 0.11264, 1: 0.11264, 2: 0.11264, 3: 0.11264}
reset:
  tower_jitter_m: 0.003
  block_along_m: [-0.100, -0.075]   # where the insert skill leaves the block (entry_m 0.09 +- 1-1.5 cm)
  block_lat_m: 0.0008
  block_yaw_deg: 0.5
  near_frac: 0.5                    # at the end face (else at the pre-push-in pose, above it)
  near_along_m: [-0.100, -0.094]    # pinch behind the block centre (first contact ~-0.086)
  near_z_m: 0.003
  lat_m: 0.004
  z_m: 0.01
  rot_deg: 3.0
obs_noise:
  episode_pos_m: 0.0005
  episode_yaw_deg: 0.3
  step_pos_m: 0.0003
  step_yaw_deg: 0.1
action:
  pos_far_m: 0.01
  pos_near_m: 0.006            # near the end face (demo push 3.6-4.0 mm per 0.1 s, peaks 4.8)
  near_radius_m: 0.015
  far_radius_m: 0.05
  rot_rad: 0.02
  ema: 0.3
  max_lead_m: 0.015
push_in:
  along_tol_m: 0.002
  lat_m: 0.0025
  tilt_deg: 5.0
  settle_steps: 3
  structure_ok_m: 0.003
  overshoot_m: 0.008
termination: {structure_m: 0.010, drop_m: 0.02, tilt_deg: 20.0}
reward:
  align: 0.3                   # pinch toward the contact point behind the end face, squash [50, 2]
  progress: 150.0              # per metre toward the slot centre (potential, capped at the centre)
  overshoot_per_cm: 5.0
  structure_per_cm: 5.0
  success: 20.0
  success_per_remaining_step: 0.5
  fail: 5.0
  action_rate: 0.01
  joint_limit: 0.1
ppo:
  num_steps_per_env: 24
  max_iterations: 300
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 3.0e-4
  schedule: adaptive
  desired_kl: 0.016
  entropy_coef: 0.004
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  max_grad_norm: 1.0
  init_noise_std: 0.5
  actor_hidden_dims: [256, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  save_interval: 100
